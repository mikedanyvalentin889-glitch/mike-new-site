<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Site Premium – Inspiré d'Apple</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/framer-motion@11.0.5/dist/framer-motion.umd.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}
  .smooth-scroll {scroll-behavior: smooth;}
</style>
</head>
<body class="bg-white text-gray-900 smooth-scroll">
<div id="root"></div>

<script type="text/babel">

const { motion, useAnimation } = window["framer-motion"];
const { useEffect } = React;

const Navbar = () => (
  <nav className="fixed top-0 left-0 w-full flex items-center justify-between px-6 py-4 bg-white/90 backdrop-blur-sm z-10 border-b border-gray-200">
    <div className="flex items-center space-x-2">
      <div className="w-6 h-6 bg-indigo-600 rounded-full"></div>
      <span className="font-bold text-lg">NovaTech</span>
    </div>
    <ul className="hidden md:flex space-x-6 text-sm font-medium">
      <li><a href="#hero" className="hover:text-indigo-600 transition">Accueil</a></li>
      <li><a href="#products" className="hover:text-indigo-600 transition">Produits</a></li>
      <li><a href="#features" className="hover:text-indigo-600 transition">Fonctionnalités</a></li>
      <li><a href="#contact" className="hover:text-indigo-600 transition">Contact</a></li>
    </ul>
    <div className="flex items-center space-x-4">
      <button aria-label="Recherche" className="p-2 hover:bg-gray-100 rounded-full transition">
        <svg className="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1016.5 9a7.5 7.5 0 00-3.85 13.65z"/>
        </svg>
      </button>
      <button className="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition">
        Panier
      </button>
    </div>
  </nav>
);

const Hero = () => {
  const controls = useAnimation();

  useEffect(() => {
    controls.start({
      opacity: 1,
      y: 0,
      transition: {duration: 0.8, ease: "easeOut"}
    });
  }, []);

  return (
    <section id="hero" className="min-h-screen flex flex-col justify-center items-center text-center bg-white pt-20">
      <motion.img
        src="https://images.unsplash.com/photo-1580894908361-8b5c5a8c2c8d?w=1200&auto=format&fit=crop"
        alt="Produit premium"
        className="w-full max-w-4xl object-cover rounded-xl shadow-lg mb-8"
        initial={{opacity:0, scale:0.95}}
        animate={controls}
      />
      <motion.h1
        className="text-5xl md:text-6xl font-bold mb-4"
        initial={{opacity:0, y:20}}
        animate={controls}
      >
        L'innovation réinventée
      </motion.h1>
      <motion.p
        className="text-xl text-gray-600 mb-8"
        initial={{opacity:0, y:20}}
        animate={controls}
      >
        Un design épuré, une technologie de pointe.
      </motion.p>
      <motion.div
        className="flex space-x-4"
        initial={{opacity:0, y:20}}
        animate={controls}
      >
        <a href="#products" className="px-6 py-3 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">
          Découvrir
        </a>
        <a href="#contact" className="px-6 py-3 border border-indigo-600 text-indigo-600 rounded-md hover:bg-indigo-50 transition">
          Acheter
        </a>
      </motion.div>
    </section>
  );
};

const ProductCard = ({title, description, img, reverse}) => {
  const variants = {
    hidden: {opacity:0, y:30},
    visible: {opacity:1, y:0, transition:{duration:0.6}}
  };
  return (
    <motion.div
      className={`flex flex-col ${reverse ? "md:flex-row-reverse" : "md:flex-row"} items-center my-12`}
      initial="hidden"
      whileInView="visible"
      viewport={{once:true, amount:0.2}}
    >
      <motion.img
        src={img}
        alt={title}
        className="w-full md:w-1/2 rounded-xl shadow-lg"
        variants={variants}
      />
      <motion.div className="md:w-1/2 md:px-12 mt-6 md:mt-0" variants={variants}>
        <h2 className="text-3xl font-bold mb-3">{title}</h2>
        <p className="text-gray-600 mb-4">{description}</p>
        <a href="#contact" className="inline-block px-5 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">
          En savoir plus
        </a>
      </motion.div>
    </motion.div>
  );
};

const Products = () => (
  <section id="products" className="px-6 py-16 bg-gray-50">
    <ProductCard
      title="NovaPhone X"
      description="Un écran bord à bord, une puce ultra‑rapide et un design sans compromis."
      img="https://images.unsplash.com/photo-1580910051075-7a7c4e9b6e8b?w=800&auto=format&fit=crop"
    />
    <ProductCard
      title="NovaWatch Pro"
      description="Suivi santé avancé, connectivité 5G et un bracelet en titane poli."
      img="https://images.unsplash.com/photo-1580910051069-3f5a4b1c2d2e?w=800&auto=format&fit=crop"
      reverse
    />
    <ProductCard
      title="NovaPad"
      description="Tablette hybride, stylet haute précision et écran OLED 12,9\"."
      img="https://images.unsplash.com/photo-1580910051092-7e2d6c4f9b8a?w=800&auto=format&fit=crop"
    />
  </section>
);

const Feature = ({icon, title, text}) => (
  <motion.div className="flex flex-col items-center text-center p-4"
    whileHover={{scale:1.05}}
    whileInView={{opacity:1, y:0, transition:{duration:0.5}}}
    initial={{opacity:0, y:30}}
    viewport={{once:true, amount:0.2}}
  >
    <div className="w-12 h-12 mb-3">{icon}</div>
    <h3 className="font-semibold text-lg mb-2">{title}</h3>
    <p className="text-gray-600">{text}</p>
  </motion.div>
);

const Features = () => (
  <section id="features" className="px-6 py-20 bg-white">
    <h2 className="text-4xl font-bold text-center mb-12">Fonctionnalités clés</h2>
    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
      <Feature
        icon={<svg className="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m2 0a2 2 0 110 4h-1a2 2 0 110-4h1zM9 12a2 2 0 110 4H8a2 2 0 110-4h1z"/></svg>}
        title="Performance"
        text="Processeur dernier cri, AI intégrée, multitâche fluide."
      />
      <Feature
        icon={<svg className="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3M5 12a7 7 0 1114 0 7 7 0 01-14 0z"/></svg>}
        title="Design"
        text="Matériaux premium, finition matte, bordures arrondies."
      />
      <Feature
        icon={<svg className="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>}
        title="Écosystème"
        text="Synchronisation instantanée entre tous vos appareils."
      />
    </div>
  </section>
);

const Footer = () => (
  <footer id="contact" className="bg-gray-900 text-gray-200 py-12 px-6">
    <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
      <div>
        <h3 className="font-semibold text-xl mb-4">NovaTech</h3>
        <p>123 Rue du Futur, Port‑au‑Prince, Haïti</p>
        <p>+509 37 00 00 00</p>
        <p>contact@novatech.ht</p>
      </div>
      <div>
        <h4 className="font-semibold mb-3">Liens utiles</h4>
        <ul className="space-y-2">
          <li><a href="#hero" className="hover:underline">Accueil</a></li>
          <li><a href="#products" className="hover:underline">Produits</a></li>
          <li><a href="#features" className="hover:underline">Fonctionnalités</a></li>
          <li><a href="#contact" className="hover:underline">Contact</a></li>
        </ul>
      </div>
      <div className="flex flex-col justify-between">
        <h4 className="font-semibold mb-3">Restez informés</h4>
        <form className="flex flex-col space-y-3">
          <input type="email" placeholder="Votre email" required className="px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          <button type="submit" className="px-4 py-2 bg-indigo-600 rounded hover:bg-indigo-700 transition">S’inscrire</button>
        </form>
      </div>
    </div>
    <div className="mt-8 text-center text-sm">
      © 2026 NovaTech. Tous droits réservés.
    </div>
  </footer>
);

const App = () => (
  <>
    <Navbar />
    <Hero />
    <Products />
    <Features />
    <Footer />
  </>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
