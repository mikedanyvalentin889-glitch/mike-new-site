<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:20px; background:#f9f9f9;}
    .product {border:1px solid #ddd; background:#fff; padding:15px; margin:10px; width:200px; display:inline-block; vertical-align:top;}
    .product img {max-width:100%; height:auto;}
    .cart {position:fixed; right:20px; top:20px; background:#fff; border:1px solid #ddd; padding:10px; width:250px;}
    .cart h2 {margin-top:0;}
    .cart-item {display:flex; justify-content:space-between; margin-bottom:5px;}
    button {background:#28a745; color:#fff; border:none; padding:5px 10px; cursor:pointer;}
    button:hover {background:#218838;}
  </style>
</head>
<body>
  <h1>Ma petite boutique</h1>
  <div id="products">
    <!-- Exemple de produits -->
    <div class="product" data-id="1" data-name="Produit A" data-price="10">
      <img src="https://via.placeholder.com/150" alt="Produit A">
      <h3>Produit A</h3>
      <p>Prix: 10 €</p>
      <button onclick="addToCart(this.parentNode)">Ajouter au panier</button>
    </div>
    <div class="product" data-id="2" data-name="Produit B" data-price="15">
      <img src="https://via.placeholder.com/150" alt="Produit B">
      <h3>Produit B</h3>
      <p>Prix: 15 €</p>
      <button onclick="addToCart(this.parentNode)">Ajouter au panier</button>
    </div>
  </div>

  <div class="cart" id="cart">
    <h2>Panier</h2>
    <div id="cart-items"></div>
    <p><strong>Total: </strong><span id="total">0</span> €</p>
    <button onclick="checkout()">Passer la commande</button>
  </div>

  <script>
    const cart = {};
    function addToCart(elem) {
      const id = elem.dataset.id;
      const name = elem.dataset.name;
      const price = parseFloat(elem.dataset.price);
      cart[id] = cart[id] || {name, price, qty:0};
      cart[id].qty++;
      renderCart();
    }
    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;
      for (const id in cart) {
        const item = cart[id];
        const line = document.createElement('div');
        line.className = 'cart-item';
        line.innerHTML = `<span>${item.name} x ${item.qty}</span><span>${(item.price*item.qty).toFixed(2)} €</span>`;
        container.appendChild(line);
        total += item.price*item.qty;
      }
      document.getElementById('total').textContent = total.toFixed(2);
    }
    function checkout() {
      alert('Merci pour votre commande !\nTotal: ' + document.getElementById('total').textContent + ' €');
      // Ici tu pourrais ajouter une intégration PayPal, Stripe, etc.
      for (const id in cart) delete cart[id];
      renderCart();
    }
  </script>
</body>
</html>
